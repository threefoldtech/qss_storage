[workspace]
members = [
    "cas-storage",
    "s3cas",
    "respd",
    "benches",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Lee Smet <lee.smet@hotmail.com>"]
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
fjall = { version = "3.1.4", features = ["bytes_1"] }
async-trait = "0.1"
md-5 = { version = "0.11.0" }
blake3 = "1.8.5"
futures = "0.3"
async-fs = "2.2"
faster-hex = "0.10.0"
uuid = { version = "1.23", features = ["v4"] }
chrono = "0.4"
anyhow = { version = "1.0.102" }
dotenv = { version = "0.15" }
openssl = { version = "0.10.80", features = ["vendored"] }
prometheus = { version = "0.14.0", features = ["process"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
s3s = { git = "https://github.com/Nugine/s3s", rev = "2236b1c" }
bytes = "1.11.1"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
hyper = { version = "1.9.0" }
http-body-util = "0.1.3"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.4"

# Dev dependencies
s3s-aws = { git = "https://github.com/Nugine/s3s", rev = "2236b1c", package = "s3s-aws" }
aws-config = { version = "1.8.17", default-features = false }
aws-credential-types = { version = "1.2.14", features = ["test-util"] }
aws-sdk-s3 = { version = "1.133.0", features = ["behavior-version-latest"] }
once_cell = "1.21.4"
tempfile = "3"
log = "0.4.30"
env_logger = "0.11.10"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1

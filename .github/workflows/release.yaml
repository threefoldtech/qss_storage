name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # No explicit toolchain install: rustup on the runner reads
      # rust-toolchain.toml and installs the pinned toolchain on first use.
      - name: Run tests
        run: cargo test --workspace

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p s3cas -p qss-storage-fsck

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: s3cas-linux
          path: target/release/s3cas

      - name: Upload Linux fsck binary
        uses: actions/upload-artifact@v4
        with:
          name: qss-storage-fsck-linux
          path: target/release/qss-storage-fsck

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p s3cas -p qss-storage-fsck

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: s3cas-macos
          path: target/release/s3cas

      - name: Upload macOS fsck binary
        uses: actions/upload-artifact@v4
        with:
          name: qss-storage-fsck-macos
          path: target/release/qss-storage-fsck

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List directories
        run: |
          ls -la
          ls -la artifacts
          ls -la artifacts/s3cas-linux || echo "Linux directory not found"
          ls -la artifacts/s3cas-macos || echo "macOS directory not found"
          ls -la artifacts/qss-storage-fsck-linux || echo "fsck Linux directory not found"
          ls -la artifacts/qss-storage-fsck-macos || echo "fsck macOS directory not found"

      - name: Rename binaries to include platform
        run: |
          if [ -f "artifacts/s3cas-linux/s3cas" ]; then
            mv artifacts/s3cas-linux/s3cas artifacts/s3cas-linux/s3cas-linux
          fi
          if [ -f "artifacts/s3cas-macos/s3cas" ]; then
            mv artifacts/s3cas-macos/s3cas artifacts/s3cas-macos/s3cas-macos
          fi
          if [ -f "artifacts/qss-storage-fsck-linux/qss-storage-fsck" ]; then
            mv artifacts/qss-storage-fsck-linux/qss-storage-fsck \
               artifacts/qss-storage-fsck-linux/qss-storage-fsck-linux
          fi
          if [ -f "artifacts/qss-storage-fsck-macos/qss-storage-fsck" ]; then
            mv artifacts/qss-storage-fsck-macos/qss-storage-fsck \
               artifacts/qss-storage-fsck-macos/qss-storage-fsck-macos
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/s3cas-linux/s3cas-linux
            artifacts/s3cas-macos/s3cas-macos
            artifacts/qss-storage-fsck-linux/qss-storage-fsck-linux
            artifacts/qss-storage-fsck-macos/qss-storage-fsck-macos

# tests/real/campaign.conf -- the campaign's own configuration.
#
# Sourced by run.sh before anything else. Every value is written as
# KEY=${KEY:-default}, so the environment always wins:
#
#     QSSRT_SCALE=64 tests/real/run.sh --phase 1
#
# Sizes are IEC strings ("4GiB", "16MiB", "1024"); parse them with
# qssrt_bytes and divide them with qssrt_scaled, which honours the floor
# beside each one. Counts are plain integers.
#
# Nothing here is a secret. The credentials below belong to a loopback-bound
# test daemon on a disk that is about to be wiped; they must match
# tests/real/qss_storage-realtest.toml, and preflight checks that they do.

# ---------------------------------------------------------------------------
# Hardware and paths
# ---------------------------------------------------------------------------

# The designated disk (ADR 0009: nvme1n1, 3.6 TB, xfs, mounted here, owned by
# the operating user). The rail refuses anything else unless
# QSSRT_UNSAFE_ALLOW_ANY_PATH=1 is set, which is how the harness is smoke
# tested against a tempdir and which stamps the verdict NOT CAMPAIGN GRADE.
QSSRT_MOUNT=${QSSRT_MOUNT:-/s3}
QSSRT_REQUIRE_FSTYPE=${QSSRT_REQUIRE_FSTYPE:-xfs}

# Proof of intent, created once by the owner, never by these scripts.
QSSRT_SENTINEL=${QSSRT_SENTINEL:-$QSSRT_MOUNT/.qss-realtest}

# The campaign's own directory under the mount. Never the mount itself: it is
# what --fresh wipes, and the mount is never an argument to a delete.
QSSRT_STORE_ROOT=${QSSRT_STORE_ROOT:-$QSSRT_MOUNT/qss-realtest}

# The two stores under it. The S3 store is what fsck walks; respd's database
# is a separate thing that shares nothing with it.
QSSRT_S3_STORE=${QSSRT_S3_STORE:-$QSSRT_STORE_ROOT/s3}

# respd's --data-dir IS its database directory, and the QSST header sidecar
# is written beside that directory rather than inside it. Pointing respd at
# <root>/resp would therefore drop a store_header.bin in the campaign's
# store root, next to the two stores -- which is exactly the kind of stray
# file --fresh is written to refuse. One level deeper keeps respd's whole
# footprint inside its own directory.
QSSRT_RESP_STORE=${QSSRT_RESP_STORE:-$QSSRT_STORE_ROOT/resp/db}

# Results live OUTSIDE the store: per-phase logs, timings, daemon logs, fsck
# reports, and the verdict. The store must never contain campaign
# bookkeeping -- fsck would report it as a foreign file, and it would be
# right.
QSSRT_RESULTS_ROOT=${QSSRT_RESULTS_ROOT:-$QSSRT_REPO_ROOT/target/realtest}

# ---------------------------------------------------------------------------
# Binaries and client tools
# ---------------------------------------------------------------------------

# Release only: the campaign measures the artifact we ship. The directory is
# a knob so the harness can be pointed at a debug build for its own tests.
QSSRT_PROFILE=${QSSRT_PROFILE:-release}
QSSRT_BIN_DIR=${QSSRT_BIN_DIR:-$QSSRT_REPO_ROOT/target/$QSSRT_PROFILE}

QSSRT_AWS=${QSSRT_AWS:-aws}
QSSRT_VALKEY_CLI=${QSSRT_VALKEY_CLI:-valkey-cli}

# The daemon config both daemons run on.
QSSRT_DAEMON_CONFIG=${QSSRT_DAEMON_CONFIG:-$QSSRT_REPO_ROOT/tests/real/qss_storage-realtest.toml}

# ---------------------------------------------------------------------------
# Endpoints
#
# Explicitly 127.0.0.1 rather than "localhost": localhost resolves to ::1
# first on this stack, and a metrics scrape that silently talks to a
# different address than the daemon bound is a debugging session nobody
# needs.
# ---------------------------------------------------------------------------

QSSRT_S3_HOST=${QSSRT_S3_HOST:-127.0.0.1}
QSSRT_S3_PORT=${QSSRT_S3_PORT:-18014}
QSSRT_METRICS_HOST=${QSSRT_METRICS_HOST:-127.0.0.1}
QSSRT_METRICS_PORT=${QSSRT_METRICS_PORT:-19100}
QSSRT_RESP_HOST=${QSSRT_RESP_HOST:-127.0.0.1}
QSSRT_RESP_PORT=${QSSRT_RESP_PORT:-16379}

QSSRT_S3_REGION=${QSSRT_S3_REGION:-us-east-1}
QSSRT_ACCESS_KEY=${QSSRT_ACCESS_KEY:-qssrealtest}
QSSRT_SECRET_KEY=${QSSRT_SECRET_KEY:-qssrealtestsecret}

# ---------------------------------------------------------------------------
# Scale
#
# The owner's sizing directive for the 3.6 TB disk is "pick max". SCALE
# DIVIDES every size below, so SCALE=1 is the campaign and SCALE=1024 is a
# smoke run over the same code paths. Each size carries a floor: a multipart
# test scaled below the 5 MiB minimum part size has stopped being one.
# ---------------------------------------------------------------------------

QSSRT_SCALE=${QSSRT_SCALE:-1}

# The seed the content generator is keyed by. Change it and every object in
# the campaign has different content; keep it and a rerun regenerates the
# same bytes on any machine.
QSSRT_SEED=${QSSRT_SEED:-qss-realtest-2026}

# ---------------------------------------------------------------------------
# Phase 1: S3 functional
# ---------------------------------------------------------------------------

QSSRT_BUCKET=${QSSRT_BUCKET:-qssrt-functional}

# Just under the 5 GiB single-PUT ceiling. Floor 1 MiB: below that it stops
# being a large-object test.
QSSRT_SINGLE_PART_BYTES=${QSSRT_SINGLE_PART_BYTES:-4GiB}
QSSRT_SINGLE_PART_FLOOR=${QSSRT_SINGLE_PART_FLOOR:-1MiB}

# More than 1000 keys, always: the pagination boundary is the point, so the
# floor stays above it however hard the run is scaled down.
QSSRT_LIST_KEYS=${QSSRT_LIST_KEYS:-1200}
QSSRT_LIST_KEYS_FLOOR=${QSSRT_LIST_KEYS_FLOOR:-1100}

# ---------------------------------------------------------------------------
# Phase 2: multipart
# ---------------------------------------------------------------------------

QSSRT_MP_BUCKET=${QSSRT_MP_BUCKET:-qssrt-multipart}

# Client-driven multipart at campaign scale. Floor 16 MiB: enough for three
# parts at the pinned chunk size.
QSSRT_MULTIPART_BYTES=${QSSRT_MULTIPART_BYTES:-16GiB}
QSSRT_MULTIPART_FLOOR=${QSSRT_MULTIPART_FLOOR:-16MiB}

# Pinned in the campaign's own AWS config, so a chunk-size default change in
# a future aws-cli cannot silently reshape the test (ADR 0009's second known
# unknown).
QSSRT_MULTIPART_THRESHOLD=${QSSRT_MULTIPART_THRESHOLD:-8MB}
QSSRT_MULTIPART_CHUNKSIZE=${QSSRT_MULTIPART_CHUNKSIZE:-8MB}
QSSRT_S3_CONCURRENCY=${QSSRT_S3_CONCURRENCY:-16}

# The part size the manual s3api half uses. S3's minimum is 5 MiB for every
# part but the last.
QSSRT_MANUAL_PART_BYTES=${QSSRT_MANUAL_PART_BYTES:-5MiB}

# ---------------------------------------------------------------------------
# Phase 3: multipart GC
# ---------------------------------------------------------------------------

QSSRT_GC_BUCKET=${QSSRT_GC_BUCKET:-qssrt-gc}

# The daemon's stale-upload TTL is expressed in DAYS and its sweep period has
# a one-hour floor, so observing a real sweep costs at least ttl + 1h. Set
# this to 1 to actually wait; the phase otherwise asserts everything that
# does not require waiting and SKIPs the sweep with the arithmetic.
QSSRT_GC_WAIT=${QSSRT_GC_WAIT:-0}

# ---------------------------------------------------------------------------
# Phase 4: RESP
# ---------------------------------------------------------------------------

QSSRT_RESP_NAMESPACE=${QSSRT_RESP_NAMESPACE:-qssrt}
QSSRT_RESP_KEYS=${QSSRT_RESP_KEYS:-2000}
QSSRT_RESP_KEYS_FLOOR=${QSSRT_RESP_KEYS_FLOOR:-200}
QSSRT_RESP_MAX_VALUE=${QSSRT_RESP_MAX_VALUE:-1MiB}
QSSRT_RESP_MAX_VALUE_FLOOR=${QSSRT_RESP_MAX_VALUE_FLOOR:-4KiB}

# ---------------------------------------------------------------------------
# Phase 5: concurrency and stress
# ---------------------------------------------------------------------------

QSSRT_STRESS_BUCKET=${QSSRT_STRESS_BUCKET:-qssrt-stress}
QSSRT_STRESS_SECONDS=${QSSRT_STRESS_SECONDS:-3600}
QSSRT_STRESS_SECONDS_FLOOR=${QSSRT_STRESS_SECONDS_FLOOR:-10}
QSSRT_STRESS_WORKERS=${QSSRT_STRESS_WORKERS:-8}
QSSRT_STRESS_OBJECT_SIZE=${QSSRT_STRESS_OBJECT_SIZE:-4MiB}
QSSRT_STRESS_OBJECT_FLOOR=${QSSRT_STRESS_OBJECT_FLOOR:-64KiB}

# The overwrite storm that pins ADR 0008: N distinct contents onto one key.
# Post-0008 the store must be left holding exactly the final object's
# occurrences -- not N objects' worth, and nothing to reconcile.
QSSRT_OVERWRITE_ROUNDS=${QSSRT_OVERWRITE_ROUNDS:-8}
QSSRT_OVERWRITE_SIZE=${QSSRT_OVERWRITE_SIZE:-64MiB}
QSSRT_OVERWRITE_FLOOR=${QSSRT_OVERWRITE_FLOOR:-2MiB}

# How much the daemon's file descriptor count may drift across a stress
# phase before it reads as a leak rather than as noise.
QSSRT_FD_SLACK=${QSSRT_FD_SLACK:-64}

# ---------------------------------------------------------------------------
# Phases 6 and 7: crash and the durability matrix
# ---------------------------------------------------------------------------

QSSRT_CRASH_BUCKET=${QSSRT_CRASH_BUCKET:-qssrt-crash}
QSSRT_CRASH_CYCLES=${QSSRT_CRASH_CYCLES:-3}
QSSRT_CRASH_WORKERS=${QSSRT_CRASH_WORKERS:-4}
QSSRT_CRASH_WINDOW_SECONDS=${QSSRT_CRASH_WINDOW_SECONDS:-60}
QSSRT_CRASH_PUT_SIZE=${QSSRT_CRASH_PUT_SIZE:-4MiB}
QSSRT_CRASH_MULTIPART_SIZE=${QSSRT_CRASH_MULTIPART_SIZE:-32MiB}

# The storm's multipart part size. The mp worker drives s3api directly --
# create, parallel upload-part, complete -- and acknowledges ONLY on the
# complete's returned ETag: aws-cli 2.36.14's `s3 cp` exits 0 when the
# daemon dies during the complete (captured live, fsync-2/mp-80,
# 2026-08-02), and an ack criterion built on an exit code manufactures
# losses no store can prevent.
QSSRT_CRASH_MP_PART_BYTES=${QSSRT_CRASH_MP_PART_BYTES:-8MiB}

# ---------------------------------------------------------------------------
# Phase 10: the terabyte (--tb)
# ---------------------------------------------------------------------------

QSSRT_TB_BUCKET=${QSSRT_TB_BUCKET:-qssrt-tb}

# Fill ~3 TiB, and never past this share of the filesystem. The cap is a
# refusal, not a truncation: a disk that cannot hold the configured target
# fails preflight rather than quietly running a smaller campaign.
QSSRT_TB_TARGET=${QSSRT_TB_TARGET:-3TiB}
QSSRT_TB_FS_CAP_PERCENT=${QSSRT_TB_FS_CAP_PERCENT:-85}

# The bands, in the ADR's composition.
QSSRT_TB_GIANT_COUNT=${QSSRT_TB_GIANT_COUNT:-4}
QSSRT_TB_GIANT_SIZE=${QSSRT_TB_GIANT_SIZE:-300GiB}
QSSRT_TB_GIANT_FLOOR=${QSSRT_TB_GIANT_FLOOR:-64MiB}

QSSRT_TB_MID_TOTAL=${QSSRT_TB_MID_TOTAL:-1536GiB}
QSSRT_TB_MID_MIN=${QSSRT_TB_MID_MIN:-1MiB}
QSSRT_TB_MID_MAX=${QSSRT_TB_MID_MAX:-16MiB}

QSSRT_TB_HUNDRED_TOTAL=${QSSRT_TB_HUNDRED_TOTAL:-150GiB}
QSSRT_TB_HUNDRED_SIZE=${QSSRT_TB_HUNDRED_SIZE:-100MiB}

QSSRT_TB_TINY_COUNT=${QSSRT_TB_TINY_COUNT:-3000000}
QSSRT_TB_TINY_SIZE=${QSSRT_TB_TINY_SIZE:-1KiB}

QSSRT_TB_DEDUP_TOTAL=${QSSRT_TB_DEDUP_TOTAL:-300GiB}
QSSRT_TB_DEDUP_OBJECT=${QSSRT_TB_DEDUP_OBJECT:-1GiB}

# Bands are sharded so a resumed run redoes at most one shard per worker.
QSSRT_TB_SHARD_KEYS=${QSSRT_TB_SHARD_KEYS:-1000}
QSSRT_TB_WORKERS=${QSSRT_TB_WORKERS:-8}

# Giants and the dedup band are verified in full; the mid, hundred and tiny
# bands are sampled. The full-store integrity claim comes from the scrub,
# which reads every block regardless.
QSSRT_TB_SAMPLE_PERCENT=${QSSRT_TB_SAMPLE_PERCENT:-1}

# The one kill -9 of the fill lands past this much written, at a randomized
# point after it.
QSSRT_TB_KILL_AFTER=${QSSRT_TB_KILL_AFTER:-1TiB}

# Phase 10's log volume: the daemon logs every request at INFO with its whole
# input, which at three million objects is on the order of a gigabyte. The
# filter keeps everything the error gate reads.
QSSRT_TB_DAEMON_LOG_FILTER=${QSSRT_TB_DAEMON_LOG_FILTER:-1}

# ---------------------------------------------------------------------------
# Timeouts and limits
# ---------------------------------------------------------------------------

QSSRT_DAEMON_START_TIMEOUT=${QSSRT_DAEMON_START_TIMEOUT:-60}
QSSRT_DAEMON_STOP_TIMEOUT=${QSSRT_DAEMON_STOP_TIMEOUT:-60}
QSSRT_DAEMON_LOG_FILTER=${QSSRT_DAEMON_LOG_FILTER:-0}
QSSRT_EVIDENCE_MAX=${QSSRT_EVIDENCE_MAX:-400}
QSSRT_LIST_MAX_PAGES=${QSSRT_LIST_MAX_PAGES:-10000}
